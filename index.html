<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="巴士報站">
<title>香港實時巴士報站器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Helvetica Neue", sans-serif;
    padding: 20px;
    -webkit-text-size-adjust: 100%;
  }

  /* 天氣欄樣式 */
  .weather-bar {
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    background-color: #111111;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 15px 22px;
    margin-bottom: 18px;
  }
  .weather-col {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    width: 48%;
  }
  .weather-tmr {
    border-left: 1px solid #2a2a2a;
    padding-left: 22px;
  }
  .w-icon {
    width: 56px;
    height: 56px;
    margin-right: 15px;
    background-color: #1d3557;
    border-radius: 10px;
    padding: 4px;
  }
  .w-label {
    font-size: 15px;
    color: #999999;
    margin-bottom: 4px;
  }
  .w-warn {
    background-color: #d9232e;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 6px;
  }
  .w-temp {
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
  }
  .w-desc {
    font-size: 15px;
    color: #bbbbbb;
    margin-top: 3px;
  }

  /* 頂部時鐘與按鈕 */
  .header {
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
    border-bottom: 1px solid #333333;
    padding-bottom: 15px;
    margin-bottom: 20px;
  }
  .clock {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
  }
  .status-area {
    text-align: right;
  }
  .update-time {
    font-size: 15px;
    color: #888888;
    margin-bottom: 8px;
  }
  .btn {
    background-color: #222222;
    color: #ffffff;
    border: 1px solid #444444;
    padding: 8px 16px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-left: 8px;
  }
  .btn:active { background-color: #444444; }
  .btn-primary { background-color: #0066cc; border-color: #0077ee; }
  .btn-danger { background-color: #aa2222; border-color: #cc3333; padding: 6px 12px; font-size: 14px; }

  /* 巴士卡片 */
  .card-list {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    margin: -10px;
  }
  .bus-card {
    width: 100%;
    background-color: #111111;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 18px 22px;
    margin: 10px;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
  }
  .route-info {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
  }
  .badge {
    font-size: 14px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    margin-right: 12px;
    display: inline-block;
  }
  .badge-kmb { background-color: #d9232e; color: #ffffff; }
  .badge-ctb { background-color: #f5b800; color: #000000; }

  .route-num {
    font-size: 46px;
    font-weight: 800;
    min-width: 115px;
    color: #ffffff;
  }
  .stop-details {
    margin-left: 15px;
  }
  .dest-name {
    font-size: 24px;
    font-weight: 700;
    color: #eeeeee;
    margin-bottom: 4px;
  }
  .stop-name {
    font-size: 17px;
    color: #999999;
  }

  .eta-box {
    text-align: right;
    min-width: 220px;
  }
  .eta-main {
    font-size: 42px;
    font-weight: 800;
    color: #00e676;
  }
  .eta-main span {
    font-size: 20px;
    font-weight: 400;
    color: #cccccc;
    margin-left: 4px;
  }
  .eta-arriving { color: #ffab00; }
  .eta-none { color: #666666; font-size: 26px; }
  .eta-next {
    font-size: 18px;
    color: #aaaaaa;
    margin-top: 6px;
  }

  /* 彈出視窗 */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.88);
    padding: 30px;
    z-index: 999;
  }
  .modal-content {
    background-color: #181818;
    border: 1px solid #444444;
    border-radius: 14px;
    max-width: 560px;
    margin: 20px auto;
    padding: 25px;
  }
  .modal h2 { margin-bottom: 18px; font-size: 24px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 6px; color: #bbbbbb; font-size: 16px; }
  .form-control {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    background-color: #000000;
    color: #ffffff;
    border: 1px solid #555555;
    border-radius: 8px;
  }
  .modal-actions {
    margin-top: 20px;
    text-align: right;
  }
  .empty-tip {
    text-align: center;
    color: #777777;
    font-size: 22px;
    padding: 60px 20px;
    width: 100%;
  }
</style>
</head>
<body>

<!-- 頂部香港天氣與明日天氣 -->
<div class="weather-bar">
  <div class="weather-col weather-now">
    <img id="nowIcon" class="w-icon" src="" alt="" style="display:none;">
    <div>
      <div class="w-label">香港現時天氣 <span id="warnBadge" class="w-warn" style="display:none;"></span></div>
      <div class="w-temp" id="nowTemp">載入中...</div>
      <div class="w-desc" id="nowDesc">正在讀取天文台數據</div>
    </div>
  </div>
  <div class="weather-col weather-tmr">
    <img id="tmrIcon" class="w-icon" src="" alt="" style="display:none;">
    <div>
      <div class="w-label" id="tmrDateLabel">明日天氣預報</div>
      <div class="w-temp" id="tmrTemp">--°C</div>
      <div class="w-desc" id="tmrDesc">載入中...</div>
    </div>
  </div>
</div>

<!-- 時鐘與操作按鈕 -->
<div class="header">
  <div class="clock" id="clock">--:--:--</div>
  <div class="status-area">
    <div class="update-time" id="updateTime">準備更新...</div>
    <div>
      <button class="btn" onclick="refreshAll()">立即更新</button>
      <button class="btn" id="editBtn" onclick="toggleEdit()">編輯</button>
      <button class="btn btn-primary" onclick="openModal()">＋ 新增路線</button>
    </div>
  </div>
</div>

<!-- 巴士路線清單 -->
<div class="card-list" id="cardList"></div>

<!-- 新增路線視窗 -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <h2>新增監察巴士路線</h2>
    <div class="form-group">
      <label>巴士公司</label>
      <select class="form-control" id="companyInput" onchange="resetStops()">
        <option value="KMB">九巴 / 龍運 (KMB)</option>
        <option value="CTB">城巴 (Citybus)</option>
      </select>
    </div>
    <div class="form-group">
      <label>路線號碼（例如：101, 960, 1A, 720）</label>
      <input type="text" class="form-control" id="routeInput" placeholder="輸入路線號碼" onkeyup="this.value=this.value.toUpperCase()">
    </div>
    <div class="form-group">
      <label>行車方向</label>
      <select class="form-control" id="dirInput" onchange="resetStops()">
        <option value="outbound">去程 (Outbound)</option>
        <option value="inbound">回程 (Inbound)</option>
      </select>
    </div>
    <div class="form-group">
      <button class="btn btn-primary" style="width:100%; padding:12px;" onclick="searchStops()">搜尋該方向車站列表</button>
    </div>
    <div class="form-group" id="stopSelectGroup" style="display:none;">
      <label id="routeDestLabel">選擇上車站</label>
      <select class="form-control" id="stopSelect"></select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="saveBtn" style="display:none;" onclick="saveRoute()">儲存路線</button>
    </div>
  </div>
</div>

<script>
var STORAGE_KEY = 'hk_bus_board_routes_v1';
var editMode = false;
var tempRouteDest = '';

var defaultRoutes = [
  { id: 'demo1', company: 'KMB', route: '101', dir: 'outbound', stopId: 'BFA3460955AC820C', stopName: '堅拿道東', dest: '觀塘(裕民坊)' },
  { id: 'demo2', company: 'CTB', route: '720', dir: 'outbound', stopId: '002437', stopName: '菲林明道, 軒尼詩道', dest: '嘉亨灣' }
];

function getRoutes() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultRoutes));
      return defaultRoutes;
    }
    return JSON.parse(raw);
  } catch (e) {
    return defaultRoutes;
  }
}

function saveRoutesList(list) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  } catch (e) {
    alert('儲存失敗：請確認瀏覽器未開啟「私密瀏覽」模式');
  }
}

function fetchWeather() {
  fetch('https://weather.gov.hk')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var tempVal = '--';
      if (data.temperature && data.temperature.data) {
        for (var i = 0; i < data.temperature.data.length; i++) {
          if (data.temperature.data[i].place === '香港天文台') {
            tempVal = data.temperature.data[i].value;
            break;
          }
        }
        if (tempVal === '--' && data.temperature.data.length > 0) {
          tempVal = data.temperature.data[0].value;
        }
      }
      var humVal = (data.humidity && data.humidity.data && data.humidity.data.length > 0) ? data.humidity.data[0].value : '--';
      document.getElementById('nowTemp').innerHTML = tempVal + '°C  <span style="font-size:18px;font-weight:400;color:#aaaaaa;">濕度 ' + humVal + '%</span>';

      if (data.icon && data.icon.length > 0) {
        var iconImg = document.getElementById('nowIcon');
        iconImg.src = 'https://hko.gov.hk' + data.icon[0] + '.png';
        iconImg.style.display = 'block';
      }
if (!stopDetails) return;
var options = '';
for (var i = 0; i < stopDetails.length; i++) {
var st = stopDetails[i].data;
options += '' + (i + 1) + '. ' + st.name_tc + '';
}
select.innerHTML = options;
document.getElementById('saveBtn').style.display = 'inline-block';
}).catch(function() {
alert('讀取九巴資料失敗，請稍後再試');
resetStops();
});
} else {
var ctbRouteUrl = 'data.gov.hk' + route;
var ctbStopsUrl = 'data.gov.hk' + route + '/' + dir;
Promise.all([
fetch(ctbRouteUrl).then(function(r) { return r.json(); }),
fetch(ctbStopsUrl).then(function(r) { return r.json(); })
]).then(function(results) {
var rData = results[0].data;
var sList = results[1].data;
if (!rData || !sList || sList.length === 0) {
alert('找不到該城巴路線或方向，請檢查號碼是否正確');
resetStops();
return;
}
tempRouteDest = (dir === 'outbound') ? rData.dest_tc : rData.orig_tc;
document.getElementById('routeDestLabel').innerHTML = '往「' + tempRouteDest + '」— 請選擇上車站：';
var stopPromises = [];
for (var i = 0; i < sList.length; i++) {
stopPromises.push(
fetch('data.gov.hk' + sList[i].stop)
.then(function(r) { return r.json(); })
);
}
return Promise.all(stopPromises);
}).then(function(stopDetails) {
if (!stopDetails) return;
var options = '';
for (var i = 0; i < stopDetails.length; i++) {
var st = stopDetails[i].data;
options += '' + (i + 1) + '. ' + st.name_tc + '';
}
select.innerHTML = options;
document.getElementById('saveBtn').style.display = 'inline-block';
}).catch(function() {
alert('讀取城巴資料失敗，請稍後再試');
resetStops();
});
}
}
function saveRoute() {
var company = document.getElementById('companyInput').value;
var route = document.getElementById('routeInput').value.trim().toUpperCase();
var dir = document.getElementById('dirInput').value;
var select = document.getElementById('stopSelect');
var stopId = select.value;
var rawText = select.options[select.selectedIndex].text;
var stopName = rawText.replace(/^\d+.\s*/, '');
var list = getRoutes();
list.push({
id: 'r_' + new Date().getTime(),
company: company,
route: route,
dir: dir,
stopId: stopId,
stopName: stopName,
dest: tempRouteDest
});
saveRoutesList(list);
closeModal();
renderCards();
refreshAll();
}
// 初始化執行
updateClock();
setInterval(updateClock, 1000);
fetchWeather();
setInterval(fetchWeather, 900000);
renderCards();
refreshAll();
setInterval(refreshAll, 20000);
