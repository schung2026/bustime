<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="巴士與天氣">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>巴士到站與天氣看板</title>
  <style>
    body {
      background-color: #111111;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 18px 20px;
      -webkit-tap-highlight-color: transparent;
    }

    /* 頂部天氣看板區域 */
    .weather-bar {
      background-color: #1c1c1e;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .weather-now {
      display: flex;
      align-items: center;
    }
    .weather-icon-main {
      width: 58px;
      height: 58px;
      background-color: #2c2c2e;
      border-radius: 10px;
      padding: 4px;
      margin-right: 15px;
    }
    .weather-temp {
      font-size: 40px;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.1;
    }
    .weather-sub {
      font-size: 16px;
      color: #bbbbbb;
      margin-top: 4px;
    }
    .weather-warn {
      display: inline-block;
      background-color: #d32f2f;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .weather-forecast {
      display: flex;
      gap: 12px;
    }
    .fc-day {
      background-color: #262629;
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
      min-width: 78px;
    }
    .fc-week {
      font-size: 15px;
      color: #ffcc00;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .fc-icon {
      width: 34px;
      height: 34px;
    }
    .fc-temp {
      font-size: 15px;
      color: #eeeeee;
      margin-top: 4px;
    }

    /* 巴士看板標題列 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      color: #ffcc00;
      margin-right: 15px;
    }
    .btn {
      background-color: #333333;
      color: #ffffff;
      border: 1px solid #555555;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 17px;
      cursor: pointer;
    }
    .btn-add {
      background-color: #0066cc;
      border-color: #0077ee;
      font-weight: bold;
    }
    .btn-edit-active {
      background-color: #d32f2f;
      border-color: #f44336;
    }
    .clock {
      font-size: 26px;
      color: #aaaaaa;
      font-variant-numeric: tabular-nums;
    }

    /* 巴士卡片 */
    .bus-card {
      background-color: #222222;
      border-radius: 12px;
      padding: 16px 22px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 10px solid #e60012;
    }
    .bus-card.ctb {
      border-left-color: #ffdd00;
    }
    .route-info {
      display: flex;
      align-items: center;
    }
    .route-num {
      font-size: 44px;
      font-weight: bold;
      width: 130px;
    }
    .dest-name {
      font-size: 23px;
      color: #eeeeee;
    }
    .stop-name {
      font-size: 17px;
      color: #999999;
      margin-top: 4px;
    }
    .eta-box {
      text-align: right;
      display: flex;
      align-items: center;
    }
    .eta-main {
      font-size: 40px;
      font-weight: bold;
      color: #00e676;
    }
    .eta-sub {
      font-size: 17px;
      color: #aaaaaa;
      margin-top: 4px;
    }
    .btn-del {
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 18px;
      font-weight: bold;
      margin-left: 18px;
      display: none;
    }
    .edit-mode .btn-del {
      display: inline-block;
    }
    .empty-msg {
      text-align: center;
      color: #888888;
      font-size: 22px;
      margin-top: 60px;
    }

    /* 新增路線彈出視窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background-color: #222222;
      border: 1px solid #444;
      border-radius: 14px;
      width: 90%;
      max-width: 550px;
      padding: 25px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: bold;
      color: #ffcc00;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
    }
    .form-row {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }
    select, input {
      background-color: #333333;
      color: #ffffff;
      border: 1px solid #555555;
      border-radius: 8px;
      padding: 12px;
      font-size: 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .stop-list-box {
      max-height: 260px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #181818;
      border: 1px solid #444;
      border-radius: 8px;
      margin-top: 15px;
      padding: 5px;
    }
    .stop-item {
      padding: 14px 12px;
      border-bottom: 1px solid #333;
      font-size: 20px;
      color: #eeeeee;
    }
    .stop-item:last-child {
      border-bottom: none;
    }
    .stop-item:active {
      background-color: #0066cc;
    }
    .status-text {
      color: #aaaaaa;
      font-size: 18px;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 頂部天氣與預報區 -->
  <div class="weather-bar">
    <div class="weather-now" id="weather-now">
      <div style="color:#888; font-size:18px;">正在載入香港天文台天氣...</div>
    </div>
    <div class="weather-forecast" id="weather-forecast"></div>
  </div>

  <!-- 巴士控制標題列 -->
  <div class="header">
    <div class="header-left">
      <h1>巴士到站看板</h1>
      <button class="btn btn-add" onclick="openModal()">+ 新增路線</button>
      <button class="btn" id="btn-edit" onclick="toggleEditMode()" style="margin-left: 10px;">管理/刪除</button>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <!-- 巴士列表 -->
  <div id="bus-list">載入中...</div>

  <!-- 新增路線彈出視窗 -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal-box">
      <div class="modal-title">
        <span>新增監察巴士線</span>
        <button class="btn" onclick="closeModal()" style="padding: 4px 12px;">✕</button>
      </div>
      
      <div class="form-row">
        <select id="inp-company" style="width: 35%;">
          <option value="KMB">九巴 / 龍運</option>
          <option value="CTB">城巴</option>
        </select>
        <input type="text" id="inp-route" placeholder="輸入路線 (如 1A)" style="width: 35%; text-transform: uppercase;">
        <select id="inp-bound" style="width: 30%;">
          <option value="outbound">去程</option>
          <option value="inbound">回程</option>
        </select>
      </div>

      <button class="btn btn-add" style="width: 100%; padding: 12px;" onclick="searchStops()">搜尋沿線車站</button>

      <div class="stop-list-box" id="stop-results">
        <div class="status-text">請輸入路線並按「搜尋沿線車站」</div>
      </div>
    </div>
  </div>

  <script>
    var STORAGE_KEY = 'ipad_bus_eta_list_v1';
    var isEditMode = false;
    var kmbStopsCache = null;
    var currentSearchMeta = {};

    var DEFAULT_BUSES = [
      {
        company: 'KMB',
        route: '1A',
        stopId: 'BFA3460955AC820C',
        serviceType: '1',
        dest: '往 尖沙咀碼頭',
        stopName: '旺角奶路臣街'
      }
    ];

    // 通用 HTTP GET 請求 (相容 iOS 12)
    function httpGet(url, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              callback(null, JSON.parse(xhr.responseText));
            } catch (e) {
              callback(e, null);
            }
          } else {
            callback('HTTP ' + xhr.status, null);
          }
        }
      };
      xhr.send();
    }

    // ================= 天氣模組 (香港天文台 API) =================
    function refreshWeather() {
      // 1. 取得本港地區天氣報告 (現時氣溫、濕度、警告)
      httpGet('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(err, data) {
        if (err || !data) return;

        var temp = '--';
        if (data.temperature && data.temperature.data) {
          // 優先尋找「香港天文台」或「九龍城」測站，否則取第一個有效測站
          for (var i = 0; i < data.temperature.data.length; i++) {
            var item = data.temperature.data[i];
            if (item.place === '香港天文台' || item.place === '九龍城') {
              temp = item.value;
              if (item.place === '香港天文台') break;
            }
          }
          if (temp === '--' && data.temperature.data.length > 0) {
            temp = data.temperature.data[0].value;
          }
        }

        var humidity = '--';
        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          humidity = data.humidity.data[0].value;
        }

        var iconCode = (data.icon && data.icon.length > 0) ? data.icon[0] : 50;
        var iconUrl = 'https://www.hko.gov.hk/images/HKOWxIconOutline/pic' + iconCode + '.png';

        var warnHtml = '';
        if (data.warningMessage && data.warningMessage.length > 0) {
          warnHtml = '<span class="weather-warn">' + data.warningMessage[0] + '</span>';
        }

        var nowHtml = 
          '<img class="weather-icon-main" src="' + iconUrl + '" alt="天氣">' +
          '<div>' +
            '<div class="weather-temp">' + temp + '°C' + warnHtml + '</div>' +
            '<div class="weather-sub">相對濕度 ' + humidity + '% ・ 香港天文台</div>' +
          '</div>';

        document.getElementById('weather-now').innerHTML = nowHtml;
      });

      // 2. 取得九天天氣預報 (取未來 4 天顯示)
      httpGet('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc', function(err, data) {
        if (err || !data || !data.weatherForecast) return;

        var forecasts = data.weatherForecast;
        var maxDays = forecasts.length > 4 ? 4 : forecasts.length;
        var fcHtml = '';

        for (var i = 0; i < maxDays; i++) {
          var day = forecasts[i];
          var weekText = (i === 0) ? '明日' : day.week.replace('星期', '週');
          var iconUrl = 'https://www.hko.gov.hk/images/HKOWxIconOutline/pic' + day.ForecastIcon + '.png';
          var minT = day.forecastMintemp ? day.forecastMintemp.value : '--';
          var maxT = day.forecastMaxtemp ? day.forecastMaxtemp.value : '--';

          fcHtml += 
            '<div class="fc-day">' +
              '<div class="fc-week">' + weekText + '</div>' +
              '<img class="fc-icon" src="' + iconUrl + '" alt="">' +
              '<div class="fc-temp">' + minT + '-' + maxT + '°</div>' +
            '</div>';
        }
        document.getElementById('weather-forecast').innerHTML = fcHtml;
      });
    }

    // ================= 巴士模組 =================
    function loadBuses() {
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return DEFAULT_BUSES;
    }

    function saveBuses(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        alert('儲存失敗，請確認 Safari 並非處於「私密瀏覽」模式');
      }
    }

    var MY_BUSES = loadBuses();

    function toggleEditMode() {
      isEditMode = !isEditMode;
      var listEl = document.getElementById('bus-list');
      var btnEl = document.getElementById('btn-edit');
      if (isEditMode) {
        listEl.className = 'edit-mode';
        btnEl.className = 'btn btn-edit-active';
        btnEl.innerText = '完成';
      } else {
        listEl.className = '';
        btnEl.className = 'btn';
        btnEl.innerText = '管理/刪除';
      }
    }

    function deleteBus(index) {
      MY_BUSES.splice(index, 1);
      saveBuses(MY_BUSES);
      refreshAll();
    }

    function openModal() {
      document.getElementById('add-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('add-modal').style.display = 'none';
    }

    function searchStops() {
      var company = document.getElementById('inp-company').value;
      var route = document.getElementById('inp-route').value.trim().toUpperCase();
      var bound = document.getElementById('inp-bound').value;
      var resultBox = document.getElementById('stop-results');

      if (!route) {
        resultBox.innerHTML = '<div class="status-text">請先輸入巴士路線號碼</div>';
        return;
      }

      resultBox.innerHTML = '<div class="status-text">正在搜尋 ' + route + ' 路線資料...</div>';

      if (company === 'KMB') {
        var routeUrl = 'https://data.etabus.gov.hk/v1/transport/kmb/route/' + route + '/' + bound + '/1';
        httpGet(routeUrl, function(err, routeRes) {
          if (err || !routeRes || !routeRes.data || !routeRes.data.dest_tc) {
            resultBox.innerHTML = '<div class="status-text">找不到該九巴路線或方向，請檢查輸入</div>';
            return;
          }
          var destName = '往 ' + routeRes.data.dest_tc;
          currentSearchMeta = { company: 'KMB', route: route, dest: destName, serviceType: '1' };

          var stopListUrl = 'https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' + route + '/' + bound + '/1';
          httpGet(stopListUrl, function(err2, stopListRes) {
            if (err2 || !stopListRes || !stopListRes.data) {
              resultBox.innerHTML = '<div class="status-text">無法讀取車站列表</div>';
              return;
            }
            var stops = stopListRes.data;

            if (kmbStopsCache) {
              renderKmbStops(stops, destName);
            } else {
              resultBox.innerHTML = '<div class="status-text">正在下載車站名稱庫 (首次需時約2秒)...</div>';
              httpGet('
