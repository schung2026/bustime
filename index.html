<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="巴士到站">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>巴士到站時間看板</title>
  <style>
    body {
      background-color: #111111;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 20px;
      -webkit-tap-highlight-color: transparent;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .header-left {
      display: flex;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 30px;
      color: #ffcc00;
      margin-right: 15px;
    }
    .btn {
      background-color: #333333;
      color: #ffffff;
      border: 1px solid #555555;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 18px;
      cursor: pointer;
    }
    .btn-add {
      background-color: #0066cc;
      border-color: #0077ee;
      font-weight: bold;
    }
    .btn-edit-active {
      background-color: #d32f2f;
      border-color: #f44336;
    }
    .clock {
      font-size: 26px;
      color: #aaaaaa;
    }
    .bus-card {
      background-color: #222222;
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 10px solid #e60012;
    }
    .bus-card.ctb {
      border-left-color: #ffdd00;
    }
    .route-info {
      display: flex;
      align-items: center;
    }
    .route-num {
      font-size: 46px;
      font-weight: bold;
      width: 135px;
    }
    .dest-name {
      font-size: 24px;
      color: #eeeeee;
    }
    .stop-name {
      font-size: 18px;
      color: #999999;
      margin-top: 4px;
    }
    .eta-box {
      text-align: right;
      display: flex;
      align-items: center;
    }
    .eta-main {
      font-size: 42px;
      font-weight: bold;
      color: #00e676;
    }
    .eta-sub {
      font-size: 18px;
      color: #aaaaaa;
      margin-top: 4px;
    }
    .btn-del {
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 20px;
      font-weight: bold;
      margin-left: 20px;
      display: none;
    }
    .edit-mode .btn-del {
      display: inline-block;
    }
    .empty-msg {
      text-align: center;
      color: #888888;
      font-size: 24px;
      margin-top: 80px;
    }

    /* 新增路線彈出視窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background-color: #222222;
      border: 1px solid #444;
      border-radius: 14px;
      width: 90%;
      max-width: 550px;
      padding: 25px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: bold;
      color: #ffcc00;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
    }
    .form-row {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }
    select, input {
      background-color: #333333;
      color: #ffffff;
      border: 1px solid #555555;
      border-radius: 8px;
      padding: 12px;
      font-size: 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .stop-list-box {
      max-height: 260px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #181818;
      border: 1px solid #444;
      border-radius: 8px;
      margin-top: 15px;
      padding: 5px;
    }
    .stop-item {
      padding: 14px 12px;
      border-bottom: 1px solid #333;
      font-size: 20px;
      color: #eeeeee;
    }
    .stop-item:last-child {
      border-bottom: none;
    }
    .stop-item:active {
      background-color: #0066cc;
    }
    .status-text {
      color: #aaaaaa;
      font-size: 18px;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1>巴士到站看板</h1>
      <button class="btn btn-add" onclick="openModal()">+ 新增路線</button>
      <button class="btn" id="btn-edit" onclick="toggleEditMode()" style="margin-left: 10px;">管理/刪除</button>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div id="bus-list">載入中...</div>

  <!-- 新增路線彈出視窗 -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal-box">
      <div class="modal-title">
        <span>新增監察巴士線</span>
        <button class="btn" onclick="closeModal()" style="padding: 4px 12px;">✕</button>
      </div>
      
      <div class="form-row">
        <select id="inp-company" style="width: 35%;">
          <option value="KMB">九巴 / 龍運</option>
          <option value="CTB">城巴</option>
        </select>
        <input type="text" id="inp-route" placeholder="輸入路線 (如 1A)" style="width: 35%; text-transform: uppercase;">
        <select id="inp-bound" style="width: 30%;">
          <option value="outbound">去程</option>
          <option value="inbound">回程</option>
        </select>
      </div>

      <button class="btn btn-add" style="width: 100%; padding: 12px;" onclick="searchStops()">搜尋沿線車站</button>

      <div class="stop-list-box" id="stop-results">
        <div class="status-text">請輸入路線並按「搜尋沿線車站」</div>
      </div>
    </div>
  </div>

  <script>
    var STORAGE_KEY = 'ipad_bus_eta_list_v1';
    var isEditMode = false;
    var kmbStopsCache = null; // 暫存九巴所有車站名稱對照表
    var currentSearchMeta = {}; // 暫存搜尋中的路線資訊

    // 預設範例路線 (初次開啟時顯示)
    var DEFAULT_BUSES = [
      {
        company: 'KMB',
        route: '1A',
        stopId: 'BFA3460955AC820C',
        serviceType: '1',
        dest: '往 尖沙咀碼頭',
        stopName: '旺角奶路臣街'
      }
    ];

    // 讀取已儲存的路線
    function loadBuses() {
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {}
      return DEFAULT_BUSES;
    }

    // 儲存路線到 iPad 本機
    function saveBuses(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        alert('儲存失敗，請確認 Safari 並非處於「私密瀏覽」模式');
      }
    }

    var MY_BUSES = loadBuses();

    // 切換刪除模式
    function toggleEditMode() {
      isEditMode = !isEditMode;
      var listEl = document.getElementById('bus-list');
      var btnEl = document.getElementById('btn-edit');
      if (isEditMode) {
        listEl.className = 'edit-mode';
        btnEl.className = 'btn btn-edit-active';
        btnEl.innerText = '完成';
      } else {
        listEl.className = '';
        btnEl.className = 'btn';
        btnEl.innerText = '管理/刪除';
      }
    }

    // 刪除指定路線
    function deleteBus(index) {
      MY_BUSES.splice(index, 1);
      saveBuses(MY_BUSES);
      refreshAll();
    }

    // 開關新增視窗
    function openModal() {
      document.getElementById('add-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('add-modal').style.display = 'none';
    }

    // 通用 HTTP GET 請求 (相容 iOS 12)
    function httpGet(url, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              callback(null, JSON.parse(xhr.responseText));
            } catch (e) {
              callback(e, null);
            }
          } else {
            callback('HTTP ' + xhr.status, null);
          }
        }
      };
      xhr.send();
    }

    // 搜尋車站步驟 1
    function searchStops() {
      var company = document.getElementById('inp-company').value;
      var route = document.getElementById('inp-route').value.trim().toUpperCase();
      var bound = document.getElementById('inp-bound').value;
      var resultBox = document.getElementById('stop-results');

      if (!route) {
        resultBox.innerHTML = '<div class="status-text">請先輸入巴士路線號碼</div>';
        return;
      }

      resultBox.innerHTML = '<div class="status-text">正在搜尋 ' + route + ' 路線資料...</div>';

      if (company === 'KMB') {
        // 先取得路線終點站名稱
        var routeUrl = 'https://data.etabus.gov.hk/v1/transport/kmb/route/' + route + '/' + bound + '/1';
        httpGet(routeUrl, function(err, routeRes) {
          if (err || !routeRes || !routeRes.data || !routeRes.data.dest_tc) {
            resultBox.innerHTML = '<div class="status-text">找不到該九巴路線或方向，請檢查輸入</div>';
            return;
          }
          var destName = '往 ' + routeRes.data.dest_tc;
          currentSearchMeta = { company: 'KMB', route: route, dest: destName, serviceType: '1' };

          // 取得該路線車站 ID 列表
          var stopListUrl = 'https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' + route + '/' + bound + '/1';
          httpGet(stopListUrl, function(err2, stopListRes) {
            if (err2 || !stopListRes || !stopListRes.data) {
              resultBox.innerHTML = '<div class="status-text">無法讀取車站列表</div>';
              return;
            }
            var stops = stopListRes.data;

            // 載入九巴全港車站名稱對照表 (只載入一次並快取)
            if (kmbStopsCache) {
              renderKmbStops(stops, destName);
            } else {
              resultBox.innerHTML = '<div class="status-text">正在下載車站名稱庫 (首次需時約2秒)...</div>';
              httpGet('https://data.etabus.gov.hk/v1/transport/kmb/stop', function(err3, allStopsRes) {
                if (err3 || !allStopsRes || !allStopsRes.data) {
                  resultBox.innerHTML = '<div class="status-text">無法載入車站名稱庫</div>';
                  return;
                }
                kmbStopsCache = {};
                for (var i = 0; i < allStopsRes.data.length; i++) {
                  var s = allStopsRes.data[i];
                  kmbStopsCache[s.stop] = s.name_tc;
                }
                renderKmbStops(stops, destName);
              });
            }
          });
        });

      } else if (company === 'CTB') {
        // 城巴路線資訊
        var ctbRouteUrl = 'https://rt.data.gov.hk/v2/transport/citybus/route/CTB/' + route;
        httpGet(ctbRouteUrl, function(err, routeRes) {
          if (err || !routeRes || !routeRes.data || !routeRes.data.dest_tc) {
            resultBox.innerHTML = '<div class="status-text">找不到該城巴路線，請檢查輸入</div>';
            return;
          }
          var destName = '往 ' + (bound === 'outbound' ? routeRes.data.dest_tc : routeRes.data.orig_tc);
          currentSearchMeta = { company: 'CTB', route: route, dest: destName };

          var ctbStopsUrl = 'https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/' + route + '/' + bound;
          httpGet(ctbStopsUrl, function(err2, stopListRes) {
            if (err2 || !stopListRes || !stopListRes.data || stopListRes.data.length === 0) {
              resultBox.innerHTML = '<div class="status-text">找不到該方向車站資料</div>';
              return;
            }
            renderCtbStops(stopListRes.data, destName);
          });
        });
      }
    }

    // 顯示九巴搜尋結果
    function renderKmbStops(stops, destName) {
      var resultBox = document.getElementById('stop-results');
      var html = '<div class="status-text" style="color:#ffcc00; padding:8px;">' + destName + ' (點擊車站加入)</div>';
      for (var i = 0; i < stops.length; i++) {
        var stopId = stops[i].stop;
        var stopName = kmbStopsCache[stopId] || stopId;
        html += '<div class="stop-item" onclick="selectStop(\'' + stopId + '\', \'' + stopName.replace(/'/g, "\\'") + '\')">' +
                  (i + 1) + '. ' + stopName +
                '</div>';
      }
      resultBox.innerHTML = html;
    }

    // 顯示城巴搜尋結果 (逐個取得站名)
    function renderCtbStops(stops, destName) {
      var resultBox = document.getElementById('stop-results');
      resultBox.innerHTML = '<div class="status-text">正在讀取城巴車站名稱...</div>';
      var names = new Array(stops.length);
      var loaded = 0;

      for (var i = 0; i < stops.length; i++) {
        (function(idx, stopId) {
          httpGet('https://rt.data.gov.hk/v2/transport/citybus/stop/' + stopId, function(err, res) {
            names[idx] = (res && res.data && res.data.name_tc) ? res.data.name_tc : stopId;
            loaded++;
            if (loaded === stops.length) {
              var html = '<div class="status-text" style="color:#ffcc00; padding:8px;">' + destName + ' (點擊車站加入)</div>';
              for (var j = 0; j < stops.length; j++) {
                html += '<div class="stop-item" onclick="selectStop(\'' + stops[j].stop + '\', \'' + names[j].replace(/'/g, "\\'") + '\')">' +
                          (j + 1) + '. ' + names[j] +
                        '</div>';
              }
              resultBox.innerHTML = html;
            }
          });
        })(i, stops[i].stop);
      }
    }

    // 選擇車站並加入看板
    function selectStop(stopId, stopName) {
      var newBus = {
        company: currentSearchMeta.company,
        route: currentSearchMeta.route,
        stopId: stopId,
        serviceType: currentSearchMeta.serviceType || '1',
        dest: currentSearchMeta.dest,
        stopName: stopName
      };
      MY_BUSES.push(newBus);
      saveBuses(MY_BUSES);
      closeModal();
      refreshAll();
    }

    // 更新時鐘
    function updateClock() {
      var now = new Date();
      var h = ('0' + now.getHours()).slice(-2);
      var m = ('0' + now.getMinutes()).slice(-2);
      var s = ('0' + now.getSeconds()).slice(-2);
      document.getElementById('clock').innerText = h + ':' + m + ':' + s;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 計算分鐘差
    function getMinutesDiff(etaString) {
      if (!etaString) return null;
      var etaDate = new Date(etaString);
      var now = new Date();
      var diffMs = etaDate - now;
      var diffMins = Math.floor(diffMs / 60000);
      if (diffMins <= 0) return '即將抵達';
      return diffMins + ' 分鐘';
    }

    // 抓取單一路線 ETA
    function fetchBusData(bus, callback) {
      var url = '';
      if (bus.company === 'KMB') {
        url = 'https://data.etabus.gov.hk/v1/transport/kmb/eta/' + bus.stopId + '/' + bus.route + '/' + bus.serviceType;
      } else if (bus.company === 'CTB') {
        url = 'https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/' + bus.stopId + '/' + bus.route;
      }

      httpGet(url, function(err, res) {
        if (err || !res || !res.data) {
          callback(err, []);
          return;
        }
        var validEtas = [];
        for (var i = 0; i < res.data.length; i++) {
          if (res.data[i].eta) {
            validEtas.push(getMinutesDiff(res.data[i].eta));
          }
        }
        callback(null, validEtas);
      });
    }

    // 更新全部巴士畫面
    function refreshAll() {
      var container = document.getElementById('bus-list');
      if (MY_BUSES.length === 0) {
        container.innerHTML = '<div class="empty-msg">尚未設定任何路線<br>請按上方「+ 新增路線」加入巴士</div>';
        return;
      }

      var htmlBuffer = new Array(MY_BUSES.length);
      var completed = 0;

      for (var i = 0; i < MY_BUSES.length; i++) {
        (function(index) {
          var bus = MY_BUSES[index];
          fetchBusData(bus, function(err, etas) {
            var mainEta = (etas && etas.length > 0) ? etas[0] : '暫無班次';
            var subEta = (etas && etas.length > 1) ? '下班車: ' + etas.slice(1, 3).join(' / ') : '';
            var cardClass = bus.company === 'CTB' ? 'bus-card ctb' : 'bus-card';

            htmlBuffer[index] = 
              '<div class="' + cardClass + '">' +
                '<div class="route-info">' +
                  '<div class="route-num">' + bus.route + '</div>' +
                  '<div>' +
                    '<div class="dest-name">' + bus.dest + '</div>' +
                    '<div class="stop-name">' + bus.stopName + '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="eta-box">' +
                  '<div>' +
                    '<div class="eta-main">' + mainEta + '</div>' +
                    '<div class="eta-sub">' + subEta + '</div>' +
                  '</div>' +
                  '<button class="btn-del" onclick="deleteBus(' + index + ')">刪除</button>' +
                '</div>' +
              '</div>';

            completed++;
            if (completed === MY_BUSES.length) {
              container.innerHTML = htmlBuffer.join('');
            }
          });
        })(i);
      }
    }

    refreshAll();
    setInterval(refreshAll, 30000);
  </script>
</body>
</html>
